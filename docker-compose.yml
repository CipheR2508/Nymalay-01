# The public site.
#
# This is the whole deployment: a static Next.js site that hands a consultation
# request to WhatsApp or email. It has no backend, no database and no
# credentials, so `docker compose up frontend` is enough to run it.
#
#   docker compose up frontend
#   open http://localhost:3000
#
# The legacy booking API is still in the repo under backend/, preserved and
# tested but not started by default. Its booking and appointment routes return
# 404 unless ENABLE_LEGACY_BOOKING_API=true, so nothing in this stack can create
# a booking. Start it deliberately, and only on a private network, with:
#
#   docker compose --profile legacy-backend up legacy-backend
#
# The staff dashboard that would talk to it is archived at
# frontend/_inactive/legacy-staff/ and is not part of this build.

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # Not started by `docker compose up`. Present so the legacy booking system can
  # be brought up deliberately; see frontend/_inactive/README.md before you do.
  legacy-backend:
    profiles:
      - legacy-backend
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://nymalaya:nymalaya_password@db:5432/nymalaya
      # Override in every real environment. Compose reads .env automatically:
      #   echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Seeds one admin account on first boot. Clear this once it exists.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@nymalay.clinic}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Required, or every booking and appointment route 404s. The flag exists
      # so that re-enabling them is a deliberate act, not a default.
      - ENABLE_LEGACY_BOOKING_API=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # Also legacy-only: the public site stores nothing.
  db:
    profiles:
      - legacy-backend
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nymalaya
      - POSTGRES_USER=nymalaya
      - POSTGRES_PASSWORD=nymalaya_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nymalaya -d nymalaya"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
